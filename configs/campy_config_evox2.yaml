# The EVO-X2 (GMKtec, Ryzen AI Max+ 395 with Radeon 8060S, Ubuntu 24.04): 3 FLIR
# Blackfly S USB3 cameras (BFS-U3-13Y3M: 1280x1024, mono) at 60 fps, triggered by
# an Arduino Nano ESP32 running campy's trigger.ino (pin 6 to each camera's Line3),
# encoded with VA-API H.264 on the Radeon (Ubuntu's ffmpeg 6.1).
#
# writeQueueMaxSec is 30 here, not 5. This computer's system SSD (a DRAM-less Lexar
# NQ790 2TB) twice stopped completing writes for about 10 s during a 3-camera
# recording (October 2026: 2 in 4.5 hours of recording, nothing in the kernel log).
# ffmpeg waits on the disk then, the frames wait in memory, and with 5 s the
# recording dropped 290 frames per camera. 30 s holds 7.1 GB of frames for 3 cameras
# at most (1.31 MB a frame, 60 fps); during live SLEAP inference at least 56 GB of
# memory stayed free or reclaimable. VA-API encoded 3 streams at about 600 fps each,
# so a 30-s backlog is gone 3 to 4 s after the disk comes back.

# Recording parameters
videoFolder: "./test"
videoFilename: "0.mp4"
frameRate: 60
recTimeInSec: 3600

# Camera parameters
numCams: 3
cameraMake: "flir"
frameWidth: 1280
frameHeight: 1024
pixelFormatInput: "gray"              # Mono8
cameraTrigger: "Line3"
cameraExposureTimeInUs: 1500

# Compression parameters
gpuID: 0
gpuMake: "vaapi"
vaapiDevice: "/dev/dri/renderD128"
codec: "h264"
quality: 21                           # VA-API's constant quantizer
pixelFormatOutput: "yuv420p"
keyframeInterval: 0.5                 # seconds
ffmpegPath: "/usr/bin/ffmpeg"
ffmpegLogLevel: "warning"
writeQueueMaxSec: 30                  # drop (and count) frames past this backlog: see above

# Launch check
preflight: "error"

# Display parameters
displayFrameRate: 0                   # no display windows (headless)

# Trigger parameters
startArduino: True
serialPort: "/dev/ttyACM0"
digitalPins: [6]
