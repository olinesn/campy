# The ChronicRecord PC (Windows 11, Core Ultra 9 285 + RTX 2000 Ada): three
# FLIR Blackfly S USB3 cameras (BFS-U3-13Y3M: 1280x1024, mono) at 30 fps,
# triggered on Line3 by an Arduino Nano (trigger.ino) on COM9, pin 6, and
# encoded with Intel Quick Sync (H.265) on the processor's GPU.
#
# Calibration videos use the same rig, slower and shorter:
#   campy-acquire configs/campy_config_chronicrecord.yaml --frameRate 10 --recTimeInSec 90 --videoFilename calibration.mp4
# Without the Arduino, the cameras free-run at frameRate:
#   campy-acquire configs/campy_config_chronicrecord.yaml --cameraTrigger None --startArduino False
#
# Exposure and gain were chosen on a test scene, a spinning fan, on
# 2026-10-16. At 200 us the fan's blades and the faces drawn on them were
# sharp; at 1500 us they smeared. Gain 7 dB was the brightest that left the
# white faces unclipped. Gain brightens the sensor's noise with the image, and
# the encoder spends bits on that noise: at quality 24 in limited range one
# camera wrote 1.0 Mbit/s at 1 dB, 1.9 at 7 dB and 9.7 at 18 dB (the camera's
# maximum).
# Set the gain for your own light, so that the brightest parts of the animals
# stay below white, without editing this file:
#   campy-acquire configs/campy_config_chronicrecord.yaml --cameraGain 10
# or one value per camera here:
#   cameraGain: [7, 10]
#
# Then check what quality costs on your own scene (a lossless clip, see the
# campy-encode-quality section of docs/encoding.md). Quick Sync kept up with 16 or more
# cameras on this PC.

# Recording parameters
videoFolder: "C:\\campy_data\\chronicRecording"   # each run records into a new dated folder in it
videoFilename: "0.mp4"
frameRate: 30
recTimeInSec: 3600

# Camera parameters
numCams: 3
cameraMake: "flir"
frameWidth: 1280
frameHeight: 1024
pixelFormatInput: "gray"              # Mono8
cameraTrigger: "Line3"                # the Arduino's pulses; "None" to free-run at frameRate
# One exposure for every camera; gain evens out their brightness. On the white
# mice in the lit home cage (2026-10-20), 750 us with these gains put the mice
# in the middle of the range in each view: at 7 dB on all three, a fifth of the
# mouse pixels clipped in Camera0 and Camera1, which the light is more above.
cameraExposureTimeInUs: 750
cameraGain: [4, 3, 7]                 # dB per camera (up to 18)
# Gamma off: the exposure and gains above were set with it off, to keep the mice
# at 20-80% of the range. 0.6 (campy's default) would lift their middle grays
# from about 50% to about 66%.
cameraGamma: "Off"

# Compression parameters
gpuID: 0
gpuMake: "intel"                      # Quick Sync
codec: "h265"                         # hevc_qsv
# Full range: the camera's 0-255 go into the video as they are. Limited range
# squeezes them into 16-235, which merges the 256 gray levels into 220 and took
# ffmpeg 3.3 ms of CPU a frame on this PC, against 1.7 in full range. Every
# level of a 0-255 chart came back to within 0.2 through OpenCV 4.6 to 5.0,
# PyAV, imageio-ffmpeg, sleap-io and MATLAB R2023b on a Mac (docs/encoding.md, colorRange).
colorRange: "full"
# Quick Sync's constant quantizer (campy passes quality + 1). Full range spends
# about 20% more bits at the same number. On the fan at 7 dB, 26 wrote
# 1.70 Mbit/s (0.77 GB per camera-hour) and scored 0.2 dB higher than limited
# range at 24, which kept the fan's detail at 1.87 Mbit/s.
# On three mice in their home cage (2026-10-20, 30 fps, 7 dB), a SLEAP model
# run on a 26 video missed 1.6% of the animals it found in the lossless clip,
# and moved their nodes 0.2 px (median; 4.5 px p95). 26 wrote 1.26 Mbit/s a
# camera, 14 GB a camera-day. 22 missed 1.1% at 2.12 Mbit/s; 30 missed 3.7%,
# 34 missed 7.7%.
quality: 26
pixelFormatOutput: "yuv420p"          # 4:2:0: what every decoder supports
keyframeInterval: 0.5                 # seconds; makes seeking cheap, and the video's fragments (fragmentedVideo,
                                      # docs/acquire.md) 0.5 s long: a power cut loses the last one, and what the encoder holds
# conda-forge's ffmpeg for Windows has no Quick Sync: use BtbN's 8.1 build
ffmpegPath: 'C:\ffmpeg-btbn-8.1\bin\ffmpeg.exe'
ffmpegLogLevel: "warning"
writeQueueMaxSec: 5                   # drop (and count) frames past this backlog

# Launch check
preflight: "error"                    # "warn" records even when a check fails

# Display parameters
displayFrameRate: 10                  # 0 = no display windows (headless)

# Trigger parameters
startArduino: True                    # starts once every camera is grabbing
serialPort: "COM9"
digitalPins: [6]                      # one pin drives all three cameras
