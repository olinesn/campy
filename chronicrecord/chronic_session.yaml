# ChronicRecord bout sessions from campy's panel (campy-session panel): the cameras, the Pico and SpikeGLX from
# one page in the browser, in place of the PowerShell launcher. On the rig it lives in C:\campy_data\configs, next
# to chronic_pico.yaml, which it extends; its desktop icon:
#   campy-session shortcut C:\campy_data\configs\chronic_session.yaml --name "ChronicRecord session"
# (in the recording environment). What the page does, in order: chronicrecord/README.md, "From the panel".
extends: chronic_pico.yaml

# The session's folder, D:\data\<date_time>\ (gate tests: D:\data\gatetest\<date_time>\, below): campy's videos,
# spikeglx\ (SpikeGLX's run), pico\ (the Pico's log) and logs\ (every program's output).
videoFolder: "D:\\data"

# The cameras in one campy-live-view window (frames only, no tracking), not a preview window per camera.
liveFeed: True
displayFrameRate: 0
view:
  show: true
  args: ["--no-3d", "--fps", "15"]

pico:
  port: "E665485457699D30" # the rig's Pico, by its USB serial number (the spare is E6654854579F5F2F)
  state_dir: "C:\\campy_data\\pico\\state"
  # The lengths the page offers, the first by default. campy's recTimeInSec is worked out from the Pico's plan for
  # the length chosen (the plan's camera pulses / 60), so they can't disagree.
  # A length's copyTo (optional) is the folder the page's "Copy each recording to" box fills in when it is picked,
  # e.g. copyTo: "\\\\server\\share\\folder"; the rig's own file names the lab's server there.
  lengths:
    - {name: "6 days", seconds: 518400}
    - {name: "Gate test (15 min, 3 bouts)", seconds: 900, videoFolder: "D:\\data\\gatetest"}
    - {name: "1 hour (12 bouts)", seconds: 3600}
    - {name: "Overnight rehearsal (8 h, 96 bouts)", seconds: 28800, videoFolder: "D:\\data\\rehearsal"} # 152 GB on 6 Nov (SpikeGLX 150, videos 2 with no animal)
  # The bouts: chronic_control.py's settings (INTERVAL 300 s, LEDs 30 ms, ...), unless set: changes them for every
  # session here, e.g. set: {INTERVAL: 600, PULSE_WIDTH_C: 0.05}. The page's "Bout settings" change them without changing
  # this file (the next panel starts from the page's last values), and each recording's session-config.yaml says which.
  # The LEDs as the neuro-seeER paper's "snapshot" photometry, once a bout: 50 ms of yellow (560 nm), 150 ms dark, 50 ms
  # of blue (465 nm); yellow lights frames 300-302 and blue 312-314 (chronicrecord/README.md, "Fiber photometry").
  # chronic_control.py's own (and the PowerShell launcher's): blue 30 ms, then yellow 30 ms at once.
  set: {YELLOW_FIRST: 1, PULSE_WIDTH_D: 0.05, LED_GAP: 0.15, PULSE_WIDTH_C: 0.05}
  gate_check: true # the gate blinks once before campy starts; SpikeGLX must open a file for it
  last_gate_s: 120 # campy ends after the last bout's last frame; the Pico's gate falls 10 s later

spikeglx:
  sdk: "C:\\campy_data\\launchers\\spikeglx" # holds sglx_pkg (SpikeGLX-CPP-SDK)
  exe: "C:\\SpikeGLX\\Release_v20260826-api4\\Release_v20260826-api4\\SpikeGLX\\SpikeGLX_NISIM.exe"
  devices: "(20,1,1)(20,obx)" # the probe (slot 20, port 1, dock 1) and the OneBox, for a SpikeGLX freshly opened
  stream: [1, 0] # the OneBox's stream, where the gate's TTL is
  run_prefix: "chronic_"
  # The panel's disk check before the start: SpikeGLX writes this many MB/s while the gate is open (the probe 23.1, the
  # OneBox 0.85, measured 4 Nov; 150.3 GB for the 8-h rehearsal's 96 bouts). Its trigger margin is read from SpikeGLX.
  write_mb_s: 24

windows:
  update_paused: true # warn unless Windows Update is paused until a day after the session's end (the page's button)
  usb_suspend: true

panel:
  title: "ChronicRecord session (Pico + SpikeGLX)" # its name on the rig's one panel (campy-session panel <folder>)
  rig_lock: auto # C:\campy_data\live\rig.py: the rig is held while the panel is open; close it from its page
  # The disk check's videos: MB/s per camera while the cameras take frames. On the high side: 60 fps H.265 of mice in a
  # lit cage is about 0.4-0.5 (worked out from 30 fps recordings); the empty cage of 6 Nov wrote about 0.1.
  video_mb_s: 0.6
  # Fiber photometry: at each Start the page asks for each LED's current on the Doric LED driver and its power measured at
  # the fiber tip with the power meter, before the animal is connected (filled in with the last values, to confirm or
  # change); kept in the recording's session.json (sessionFields.ledPower). The Pico's C output drives the blue LED, D
  # the yellow one.
  led_power: ["Blue LED (465 nm)", "Yellow LED (560 nm)"]
