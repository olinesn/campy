<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="1000" height="580" fill="#ffffff"/>
<text x="24" y="32" font-size="15" fill="#334155" text-anchor="start" font-weight="bold">One input of the input board, drawn in full: there are eight (IN 0–7, each to its own A pin)</text>
<circle cx="80" cy="170" r="22" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/>
<circle cx="80" cy="170" r="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
<circle cx="80" cy="170" r="3" fill="#15803d"/>
<text x="80" y="136" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">IN n (BNC)</text>
<polyline points="80,192 80,230" fill="none" stroke="#111111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="80" y1="230" x2="80" y2="238" stroke="#111111" stroke-width="2.2" stroke-linecap="round"/>
<line x1="66" y1="238" x2="94" y2="238" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<line x1="71" y1="243" x2="89" y2="243" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<line x1="76" y1="248" x2="84" y2="248" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="278" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="normal">shell to the</text>
<text x="80" y="292" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="normal">ground bus</text>
<line x1="88" y1="170" x2="157.0" y2="170" stroke="#15803d" stroke-width="2.2" stroke-linecap="round"/>
