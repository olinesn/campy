<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The dashboard's light probe always reads the rig's lock file. It reads the other sources (git tag, disk and process names, the recording and launcher status files, the last rig-check result, and the snapshot fleet jobs write) only when no other session holds the rig. The Mac turns what it read into an HTML page with stale parts marked."><style>svg{--bg:#fbfaf7;--fg:#1f2328;--muted:#646b73;--line:#d5d2ca;--panel:#f1efe9;--accent:#1f6feb;--accent-bg:#e3edfd;--warn:#c2410c;--warn-bg:#fbe9df; color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme: dark){svg{--bg:#16181c;--fg:#e6e4df;--muted:#9aa0a8;--line:#3a3d44;--panel:#1f2227;--accent:#6ea8ff;--accent-bg:#1b2a44;--warn:#ff9a66;--warn-bg:#3a2418;}}.bg{fill:var(--bg)}
.box { fill: var(--bg); stroke: currentColor; stroke-width: 1.3; }
.box.acc { fill: var(--accent-bg); stroke: var(--accent); }
.box.warn { fill: var(--warn-bg); stroke: var(--warn); }
.box.soft { fill: var(--panel); stroke: var(--line); }
.band { fill: var(--panel); stroke: none; }
.edge { stroke: currentColor; stroke-width: 1.3; fill: none; }
.edge.acc { stroke: var(--accent); }
.edge.warn { stroke: var(--warn); }
.edge.dash { stroke-dasharray: 5 4; }
.sep { stroke: var(--line); stroke-width: 1; }
.t { fill: currentColor; font-size: 13px; }
.t.b { font-weight: 600; }
.t.s { font-size: 11.5px; fill: var(--muted); }
.t.acc { fill: var(--accent); }
.t.warn { fill: var(--warn); }
.t.h { font-size: 13px; font-weight: 700; fill: var(--muted); letter-spacing: .02em; }
.head { fill: currentColor; }
.head.acc { fill: var(--accent); }
.head.warn { fill: var(--warn); }
</style><rect class="bg" x="0" y="0" width="760" height="300"/>
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
    <marker id="a5acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head acc"/></marker>
  </defs>
  <text class="t h" x="10" y="14">ON THE RIG</text>
  <rect class="box acc" x="10" y="22" width="240" height="42" rx="6"/>
  <text class="t" x="130" y="48" text-anchor="middle">lock file: who holds the rig</text>
  <rect class="box" x="10" y="74" width="240" height="42" rx="6"/>
  <text class="t" x="130" y="100" text-anchor="middle">git tag, disk, process names</text>
  <rect class="box" x="10" y="126" width="240" height="42" rx="6"/>
  <text class="t" x="130" y="152" text-anchor="middle">recording.json · launcher.json</text>
  <rect class="box" x="10" y="178" width="240" height="42" rx="6"/>
  <text class="t" x="130" y="204" text-anchor="middle">last rig-check result</text>
  <rect class="box" x="10" y="230" width="240" height="56" rx="6"/>
  <text class="t" x="130" y="253" text-anchor="middle">snapshot from fleet jobs</text>
  <text class="t s" x="130" y="271" text-anchor="middle">USB speed, pip versions</text>

  <rect class="box" x="330" y="110" width="170" height="80" rx="6"/>
  <text class="t b" x="415" y="138" text-anchor="middle">light probe (SSH)</text>
  <text class="t s" x="415" y="157" text-anchor="middle">files, git, df only</text>
  <text class="t s" x="415" y="174" text-anchor="middle">never python</text>
  <rect class="box acc" x="570" y="110" width="180" height="80" rx="6"/>
  <text class="t b" x="660" y="138" text-anchor="middle">campy-fleet status</text>
  <text class="t s" x="660" y="157" text-anchor="middle">HTML page on the Mac</text>
  <text class="t s" x="660" y="174" text-anchor="middle">stale parts marked</text>

  <polyline class="edge acc" points="250,43 320,43 320,120 328,120" marker-end="url(#a5acc)"/>
  <polyline class="edge dash" points="250,95 305,95 305,136 328,136" marker-end="url(#a5)"/>
  <polyline class="edge dash" points="250,147 328,147" marker-end="url(#a5)"/>
  <polyline class="edge dash" points="250,199 305,199 305,164 328,164" marker-end="url(#a5)"/>
  <polyline class="edge dash" points="250,258 320,258 320,180 328,180" marker-end="url(#a5)"/>
  <line class="edge" x1="500" y1="150" x2="568" y2="150" marker-end="url(#a5)"/>

  <line class="edge acc" x1="420" y1="244" x2="456" y2="244"/>
  <text class="t s" x="464" y="248">always read</text>
  <line class="edge dash" x1="420" y1="268" x2="456" y2="268"/>
  <text class="t s" x="464" y="272">read only when no other session holds the rig</text>
</svg>
