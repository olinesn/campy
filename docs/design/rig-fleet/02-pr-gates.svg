<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="A PR runs on the rigs only if it passes four gates in order: label added by olinesn, author olinesn with a branch in this repo, changes to live, camera or writer code, and unchanged dependencies. Failing a gate means it is ignored, skipped or reported. Passing all four tests the commit that was current when the label was added."><style>svg{--bg:#fbfaf7;--fg:#1f2328;--muted:#646b73;--line:#d5d2ca;--panel:#f1efe9;--accent:#1f6feb;--accent-bg:#e3edfd;--warn:#c2410c;--warn-bg:#fbe9df; color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme: dark){svg{--bg:#16181c;--fg:#e6e4df;--muted:#9aa0a8;--line:#3a3d44;--panel:#1f2227;--accent:#6ea8ff;--accent-bg:#1b2a44;--warn:#ff9a66;--warn-bg:#3a2418;}}.bg{fill:var(--bg)}
.box { fill: var(--bg); stroke: currentColor; stroke-width: 1.3; }
.box.acc { fill: var(--accent-bg); stroke: var(--accent); }
.box.warn { fill: var(--warn-bg); stroke: var(--warn); }
.box.soft { fill: var(--panel); stroke: var(--line); }
.band { fill: var(--panel); stroke: none; }
.edge { stroke: currentColor; stroke-width: 1.3; fill: none; }
.edge.acc { stroke: var(--accent); }
.edge.warn { stroke: var(--warn); }
.edge.dash { stroke-dasharray: 5 4; }
.sep { stroke: var(--line); stroke-width: 1; }
.t { fill: currentColor; font-size: 13px; }
.t.b { font-weight: 600; }
.t.s { font-size: 11.5px; fill: var(--muted); }
.t.acc { fill: var(--accent); }
.t.warn { fill: var(--warn); }
.t.h { font-size: 13px; font-weight: 700; fill: var(--muted); letter-spacing: .02em; }
.head { fill: currentColor; }
.head.acc { fill: var(--accent); }
.head.warn { fill: var(--warn); }
</style><rect class="bg" x="0" y="0" width="760" height="250"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  </defs>
  <rect class="box" x="10" y="30" width="120" height="62" rx="6"/>
  <text class="t" x="70" y="56" text-anchor="middle">label added</text>
  <text class="t" x="70" y="74" text-anchor="middle">by olinesn?</text>
  <rect class="box" x="162" y="30" width="120" height="62" rx="6"/>
  <text class="t" x="222" y="56" text-anchor="middle">author olinesn,</text>
  <text class="t" x="222" y="74" text-anchor="middle">branch in repo?</text>
  <rect class="box" x="314" y="30" width="120" height="62" rx="6"/>
  <text class="t" x="374" y="56" text-anchor="middle">live, camera or</text>
  <text class="t" x="374" y="74" text-anchor="middle">writer code?</text>
  <rect class="box" x="466" y="30" width="120" height="62" rx="6"/>
  <text class="t" x="526" y="56" text-anchor="middle">dependencies</text>
  <text class="t" x="526" y="74" text-anchor="middle">unchanged?</text>
  <rect class="box acc" x="618" y="30" width="120" height="62" rx="6"/>
  <text class="t b" x="678" y="56" text-anchor="middle">run the commit</text>
  <text class="t b" x="678" y="74" text-anchor="middle">at label time</text>

  <line class="edge" x1="130" y1="61" x2="160" y2="61" marker-end="url(#a2)"/>
  <line class="edge" x1="282" y1="61" x2="312" y2="61" marker-end="url(#a2)"/>
  <line class="edge" x1="434" y1="61" x2="464" y2="61" marker-end="url(#a2)"/>
  <line class="edge" x1="586" y1="61" x2="616" y2="61" marker-end="url(#a2)"/>
  <text class="t s" x="146" y="53" text-anchor="middle">yes</text>
  <text class="t s" x="298" y="53" text-anchor="middle">yes</text>
  <text class="t s" x="450" y="53" text-anchor="middle">yes</text>
  <text class="t s" x="602" y="53" text-anchor="middle">yes</text>

  <line class="edge" x1="70" y1="92" x2="70" y2="148" marker-end="url(#a2)"/>
  <line class="edge" x1="222" y1="92" x2="222" y2="148" marker-end="url(#a2)"/>
  <line class="edge" x1="374" y1="92" x2="374" y2="148" marker-end="url(#a2)"/>
  <line class="edge" x1="526" y1="92" x2="526" y2="148" marker-end="url(#a2)"/>
  <text class="t s" x="78" y="125">no</text>
  <text class="t s" x="230" y="125">no</text>
  <text class="t s" x="382" y="125">no</text>
  <text class="t s" x="534" y="125">no</text>

  <rect class="box soft" x="10" y="150" width="120" height="54" rx="6"/>
  <text class="t" x="70" y="173" text-anchor="middle">ignored</text>
  <text class="t s" x="70" y="191" text-anchor="middle">nothing runs</text>
  <rect class="box soft" x="162" y="150" width="120" height="54" rx="6"/>
  <text class="t" x="222" y="173" text-anchor="middle">ignored</text>
  <text class="t s" x="222" y="191" text-anchor="middle">forks never run</text>
  <rect class="box soft" x="314" y="150" width="120" height="54" rx="6"/>
  <text class="t" x="374" y="173" text-anchor="middle">skipped</text>
  <text class="t s" x="374" y="191" text-anchor="middle">e.g. docs only</text>
  <rect class="box soft" x="466" y="150" width="120" height="54" rx="6"/>
  <text class="t" x="526" y="173" text-anchor="middle">comment</text>
  <text class="t s" x="526" y="191" text-anchor="middle">needs new packages</text>
  <rect class="box soft" x="618" y="150" width="120" height="54" rx="6" stroke-dasharray="5 4"/>
  <text class="t" x="678" y="173" text-anchor="middle">pushed again?</text>
  <text class="t s" x="678" y="191" text-anchor="middle">label it again</text>
  <text class="t s" x="374" y="236" text-anchor="middle">each gate is checked through the GitHub API on every pass</text>
</svg>
