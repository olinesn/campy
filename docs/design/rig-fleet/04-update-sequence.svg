  <text class="t s" x="551" y="284" text-anchor="middle">baseline</text>
  <line class="edge" x1="358" y1="232" x2="372" y2="232" marker-end="url(#a4)"/>
  <line class="edge" x1="484" y1="232" x2="498" y2="232" marker-end="url(#a4)"/>
  <polyline class="edge" points="544,250 544,256 297,256 297,260" marker-end="url(#a4)"/>
  <line class="edge" x1="332" y1="280" x2="344" y2="280" marker-end="url(#a4)"/>
  <line class="edge" x1="416" y1="280" x2="428" y2="280" marker-end="url(#a4)"/>
  <line class="edge" x1="500" y1="280" x2="512" y2="280" marker-end="url(#a4)"/>

  <line class="edge" x1="155" y1="104" x2="155" y2="194" marker-end="url(#a4)"/>
  <text class="t s" x="163" y="124">scp</text>
  <text class="t s" x="163" y="138">(safe while busy)</text>
  <line class="edge" x1="345" y1="104" x2="345" y2="182" marker-end="url(#a4)"/>
  <text class="t s" x="353" y="131">launch when free</text>
  <polyline class="edge" points="600,246 675,246 675,106" marker-end="url(#a4)"/>
  <text class="t s" x="683" y="190">result JSON</text>
</svg>
