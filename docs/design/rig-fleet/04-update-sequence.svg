<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Update sequence. The Mac fetches tags and builds one bundle, copies it to each rig, re-reads the lock file every 5 minutes, and launches the job once the rig is free. On the rig, one rig.py job holds the lock while it fast-forwards the checkout, reinstalls both environments, checks versions, runs smoke1, smoke3 and replay3, and updates the baseline. The result JSON goes back to the Mac, which writes the report."><style>svg{--bg:#fbfaf7;--fg:#1f2328;--muted:#646b73;--line:#d5d2ca;--panel:#f1efe9;--accent:#1f6feb;--accent-bg:#e3edfd;--warn:#c2410c;--warn-bg:#fbe9df; color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme: dark){svg{--bg:#16181c;--fg:#e6e4df;--muted:#9aa0a8;--line:#3a3d44;--panel:#1f2227;--accent:#6ea8ff;--accent-bg:#1b2a44;--warn:#ff9a66;--warn-bg:#3a2418;}}.bg{fill:var(--bg)}
.box { fill: var(--bg); stroke: currentColor; stroke-width: 1.3; }
.box.acc { fill: var(--accent-bg); stroke: var(--accent); }
.box.warn { fill: var(--warn-bg); stroke: var(--warn); }
.box.soft { fill: var(--panel); stroke: var(--line); }
.band { fill: var(--panel); stroke: none; }
.edge { stroke: currentColor; stroke-width: 1.3; fill: none; }
.edge.acc { stroke: var(--accent); }
.edge.warn { stroke: var(--warn); }
.edge.dash { stroke-dasharray: 5 4; }
.sep { stroke: var(--line); stroke-width: 1; }
.t { fill: currentColor; font-size: 13px; }
.t.b { font-weight: 600; }
.t.s { font-size: 11.5px; fill: var(--muted); }
.t.acc { fill: var(--accent); }
.t.warn { fill: var(--warn); }
.t.h { font-size: 13px; font-weight: 700; fill: var(--muted); letter-spacing: .02em; }
.head { fill: currentColor; }
.head.acc { fill: var(--accent); }
.head.warn { fill: var(--warn); }
</style><rect class="bg" x="0" y="0" width="760" height="330"/>
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  </defs>
  <rect class="band" x="10" y="10" width="740" height="112" rx="8"/>
  <rect class="band" x="10" y="150" width="740" height="170" rx="8"/>
  <text class="t h" x="24" y="32">YOUR MAC</text>
  <text class="t h" x="24" y="172">EACH RIG · ALL 3 IN PARALLEL</text>

  <rect class="box" x="90" y="48" width="130" height="56" rx="6"/>
  <text class="t b" x="155" y="71" text-anchor="middle">fetch tags</text>
  <text class="t s" x="155" y="89" text-anchor="middle">build one bundle</text>
  <rect class="box" x="270" y="48" width="150" height="56" rx="6"/>
  <text class="t b" x="345" y="71" text-anchor="middle">wait for free rig</text>
  <text class="t s" x="345" y="89" text-anchor="middle">lock file every 5 min</text>
  <rect class="box acc" x="610" y="48" width="130" height="56" rx="6"/>
  <text class="t b" x="675" y="71" text-anchor="middle">report</text>
  <text class="t s" x="675" y="89" text-anchor="middle">+ docs numbers block</text>
  <line class="edge" x1="220" y1="76" x2="268" y2="76" marker-end="url(#a4)"/>

  <rect class="box" x="90" y="196" width="130" height="56" rx="6"/>
  <text class="t b" x="155" y="219" text-anchor="middle">bundle copied</text>
  <text class="t s" x="155" y="237" text-anchor="middle">bundles folder</text>

  <rect class="box acc" x="250" y="184" width="350" height="124" rx="8"/>
  <text class="t b" x="262" y="203">one rig.py job, holding the lock</text>
  <rect class="box" x="262" y="214" width="96" height="36" rx="5"/>
  <text class="t s" x="310" y="236" text-anchor="middle">ff-only merge</text>
