<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Option A: the Mac reads the PR from GitHub, sends the code to the rig over SSH, and posts only numbers back; GitHub and the rigs never connect. Option B: a runner service on the rig takes jobs and PR code straight from GitHub and sends back public job logs containing the host name and paths."><style>svg{--bg:#fbfaf7;--fg:#1f2328;--muted:#646b73;--line:#d5d2ca;--panel:#f1efe9;--accent:#1f6feb;--accent-bg:#e3edfd;--warn:#c2410c;--warn-bg:#fbe9df; color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme: dark){svg{--bg:#16181c;--fg:#e6e4df;--muted:#9aa0a8;--line:#3a3d44;--panel:#1f2227;--accent:#6ea8ff;--accent-bg:#1b2a44;--warn:#ff9a66;--warn-bg:#3a2418;}}.bg{fill:var(--bg)}
.box { fill: var(--bg); stroke: currentColor; stroke-width: 1.3; }
.box.acc { fill: var(--accent-bg); stroke: var(--accent); }
.box.warn { fill: var(--warn-bg); stroke: var(--warn); }
.box.soft { fill: var(--panel); stroke: var(--line); }
.band { fill: var(--panel); stroke: none; }
.edge { stroke: currentColor; stroke-width: 1.3; fill: none; }
.edge.acc { stroke: var(--accent); }
.edge.warn { stroke: var(--warn); }
.edge.dash { stroke-dasharray: 5 4; }
.sep { stroke: var(--line); stroke-width: 1; }
.t { fill: currentColor; font-size: 13px; }
.t.b { font-weight: 600; }
.t.s { font-size: 11.5px; fill: var(--muted); }
.t.acc { fill: var(--accent); }
.t.warn { fill: var(--warn); }
.t.h { font-size: 13px; font-weight: 700; fill: var(--muted); letter-spacing: .02em; }
.head { fill: currentColor; }
.head.acc { fill: var(--accent); }
.head.warn { fill: var(--warn); }
</style><rect class="bg" x="0" y="0" width="760" height="420"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
    <marker id="a1acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head acc"/></marker>
    <marker id="a1warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head warn"/></marker>
  </defs>
  <rect class="band" x="20" y="40" width="200" height="370" rx="8"/>
  <rect class="band" x="280" y="40" width="200" height="370" rx="8"/>
  <rect class="band" x="540" y="40" width="200" height="370" rx="8"/>
  <text class="t h" x="120" y="28" text-anchor="middle">GITHUB (PUBLIC REPO)</text>
  <text class="t h" x="380" y="28" text-anchor="middle">YOUR MAC</text>
  <text class="t h" x="640" y="28" text-anchor="middle">LAB NETWORK (RIGS)</text>

  <text class="t b acc" x="32" y="66">A · recommended</text>
  <rect class="box" x="40" y="84" width="160" height="66" rx="6"/>
  <text class="t b" x="120" y="111" text-anchor="middle">PR + rig-check label</text>
  <text class="t s" x="120" y="130" text-anchor="middle">added by olinesn</text>
  <rect class="box acc" x="300" y="84" width="160" height="66" rx="6"/>
  <text class="t b" x="380" y="111" text-anchor="middle">campy-fleet ci</text>
  <text class="t s" x="380" y="130" text-anchor="middle">checks the gates</text>
  <rect class="box" x="560" y="84" width="160" height="66" rx="6"/>
  <text class="t b" x="640" y="111" text-anchor="middle">ci/pr&lt;N&gt; folder</text>
  <text class="t s" x="640" y="130" text-anchor="middle">rig.py --no-wait --yield</text>
  <line class="edge acc" x1="200" y1="100" x2="298" y2="100" marker-end="url(#a1acc)"/>
  <text class="t s" x="250" y="93" text-anchor="middle">reads PR, label</text>
  <line class="edge acc" x1="460" y1="100" x2="558" y2="100" marker-end="url(#a1acc)"/>
  <text class="t s" x="510" y="93" text-anchor="middle">bundle via SSH</text>
  <line class="edge acc" x1="560" y1="136" x2="462" y2="136" marker-end="url(#a1acc)"/>
  <text class="t s" x="510" y="152" text-anchor="middle">result JSON</text>
  <line class="edge acc" x1="300" y1="136" x2="202" y2="136" marker-end="url(#a1acc)"/>
  <text class="t s" x="250" y="152" text-anchor="middle">numbers only</text>
  <text class="t s" x="380" y="196" text-anchor="middle">GitHub and the rigs never connect · rigs hold no GitHub credentials</text>

  <line class="sep" x1="20" y1="222" x2="740" y2="222"/>

  <text class="t b" x="32" y="250">B · self-hosted runners</text>
  <rect class="box" x="40" y="268" width="160" height="66" rx="6"/>
  <text class="t b" x="120" y="295" text-anchor="middle">workflow job</text>
  <text class="t s" x="120" y="314" text-anchor="middle">any branch, runs-on: rig</text>
  <rect class="box warn" x="560" y="268" width="160" height="66" rx="6"/>
  <text class="t b" x="640" y="295" text-anchor="middle">runner service</text>
  <text class="t s" x="640" y="314" text-anchor="middle">as the rig's user</text>
  <line class="edge" x1="200" y1="284" x2="558" y2="284" marker-end="url(#a1)"/>
  <text class="t s" x="380" y="277" text-anchor="middle">job + PR code (runner polls GitHub)</text>
  <line class="edge warn" x1="560" y1="320" x2="202" y2="320" marker-end="url(#a1warn)"/>
  <text class="t s warn" x="380" y="338" text-anchor="middle">job logs, public: host name, paths</text>
  <text class="t s" x="380" y="385" text-anchor="middle">Mac not involved</text>
</svg>
