name: Trigger sketch

# Compiles campy/trigger/trigger.ino, the outputs board's sketch
# (campy/outputs_board/campy_outputs, for campy-rules) and the ChronicRecord
# Pico's (chronicrecord/chronic_timer, its PIO code), for real boards. The tests also
# run them, but as plain C++ against a simulated Arduino (tests/arduino_sim),
# which cannot catch what only a board's compiler and core would (an 8-bit int,
# a missing API, the ESP32's registers).
# Each board compiles only its own sketch folder: compile-sketches searches a
# folder's subfolders too, so the outputs sketch lives outside campy/trigger
# (it is for the Nano ESP32 only).
on:
  push:
    branches: [master, dev]
    paths:
      - "campy/trigger/trigger.ino"
      - "campy/outputs_board/campy_outputs/**"
      - "chronicrecord/chronic_timer/**"
      - ".github/workflows/sketch.yml"
  pull_request:
    paths:
      - "campy/trigger/trigger.ino"
      - "campy/outputs_board/campy_outputs/**"
      - "chronicrecord/chronic_timer/**"
      - ".github/workflows/sketch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sketch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: ${{ matrix.board.name }}
    # Ubuntu 24.04, not ubuntu-latest: on 26.04 compile-sketches' own Python (3.12.4) can't be installed
    # ("not found for Ubuntu 26.04"), and every board failed before compiling
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: Arduino Uno
            fqbn: arduino:avr:uno
            sketch: campy/trigger
            platforms: |
              - name: arduino:avr
          - name: Teensy 4.0
            fqbn: teensy:avr:teensy40
            sketch: campy/trigger
            platforms: |
              - name: teensy:avr
                source-url: https://www.pjrc.com/teensy/package_teensy_index.json
          - name: Teensy 3.2
            fqbn: teensy:avr:teensy31
            sketch: campy/trigger
            platforms: |
              - name: teensy:avr
                source-url: https://www.pjrc.com/teensy/package_teensy_index.json
          - name: Nano ESP32 (outputs board)
            fqbn: arduino:esp32:nano_nora
            sketch: campy/outputs_board/campy_outputs
            platforms: |
              - name: arduino:esp32
          - name: Raspberry Pi Pico (ChronicRecord timer)
            fqbn: rp2040:rp2040:rpipico
            sketch: chronicrecord/chronic_timer
            platforms: |
              - name: rp2040:rp2040
                source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          sketch-paths: |
            - ${{ matrix.board.sketch }}
