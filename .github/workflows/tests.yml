name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python }}${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}${{ matrix.os == 'ubuntu-24.04-arm' && ' on ARM' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04, not ubuntu-latest: on 2026-11-05 ubuntu-latest became 26.04, which has no
        # Python 3.9 for setup-python
        os: [ubuntu-24.04]
        # 3.9: the oldest campy (setup.py) and nireyecam support. 3.10: FLIR's PySpin on
        # Ubuntu 22.04. 3.12: docs/install.md's, and PySpin's on Windows, macOS and Ubuntu 24.04.
        python: ["3.9", "3.10", "3.12"]
        include:
          # Windows rigs, at the Python docs/install.md installs
          - os: windows-latest
            python: "3.12"
          # ARM64 (as on an NVIDIA Jetson), where the CPU may reorder memory: the live
          # feed's fences (campy/livefeed.py) are tested there
          - os: ubuntu-24.04-arm
            python: "3.12"
    defaults:
      run:
        # Git Bash on Windows too, so ${NIREYECAM_TOKEN} below expands the same way
        shell: bash
    env:
      # Optional: a read-only token for the private nir-eye-cam repository, so the
      # RatCam tests (tests/test_ratcam.py) run too. Without it they are skipped.
      NIREYECAM_TOKEN: ${{ secrets.NIREYECAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.os != 'ubuntu-24.04-arm'
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: setup.py
      - name: PyQt5 from Ubuntu (ARM)
        # PyPI has no PyQt5 wheel for ARM Linux, and building one takes too long. As on
        # a Jetson: Ubuntu's PyQt5, for its own Python 3.12, in a venv that
        # sees it
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt5 python3-venv
          python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install campy
        # OpenCV (opencv-python-headless) comes with campy (setup.py): campy-acquire shows its
        # cameras in campy-live-view, which draws with it in Qt's window
        # pytest-xdist: the tests run on 4 workers at once (-n 4, below)
        run: python -m pip install -e . pytest pytest-xdist
      - name: Install sleap-io (campy-live-export's tests)
        # Also campy-live's environment's, with sleap-nn; it needs Python 3.10 or later,
        # so on 3.9 those tests are skipped
        if: matrix.python != '3.9'
        run: python -m pip install sleap-io
      - name: Install nireyecam (RatCam support)
        if: env.NIREYECAM_TOKEN != ''
        run: python -m pip install "nireyecam @ git+https://x-access-token:${NIREYECAM_TOKEN}@github.com/olinesn/nir-eye-cam.git#subdirectory=host"
      - name: Test
        # On 4 workers at once (pytest-xdist): most tests wait on real-time recordings, timers and child
        # processes rather than the CPU, so they overlap well. 4, not -n auto: with psutil installed (campy needs
        # it) auto counts physical cores, which is 2 on GitHub's x64 runners (2 cores of 2 threads) and 4 on ARM.
        # --dist worksteal: a worker that has run out of tests takes some queued on another, so none waits behind
        # a long test while others idle. --durations lists the 25 slowest, to see where the time goes when the job
        # grows. The 'alone' tests (bench/rig.py's, which look at every process on the machine) are skipped there,
        # and run on their own in the next step
        run: |
          python -m pytest -q -rs -n 4 --dist worksteal --durations=25 -m "not alone" tests
      - name: Test (rig.py's, alone)
        if: success() || failure()
        run: python -m pytest -q -rs --durations=10 -m alone tests
