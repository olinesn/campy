name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python }}${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.9: the oldest nireyecam supports. 3.10: FLIR's PySpin on Linux, so the
        # acquisition PC's. 3.12: PySpin on Windows and macOS, and the newest here.
        python: ["3.9", "3.10", "3.12"]
        include:
          # Windows rigs, at the Python the README installs
          - os: windows-latest
            python: "3.10"
    defaults:
      run:
        # Git Bash on Windows too, so ${NIREYECAM_TOKEN} below expands the same way
        shell: bash
    env:
      # Optional: a read-only token for the private nir-eye-cam repository, so the
      # RatCam tests (tests/test_ratcam.py) run too. Without it they are skipped.
      NIREYECAM_TOKEN: ${{ secrets.NIREYECAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: setup.py
      - name: Install campy
        run: python -m pip install -e . pytest
      - name: Install nireyecam (RatCam support)
        if: env.NIREYECAM_TOKEN != ''
        run: python -m pip install "nireyecam @ git+https://x-access-token:${NIREYECAM_TOKEN}@github.com/olinesn/nir-eye-cam.git#subdirectory=host"
      - name: Test
        run: python -m pytest -q -rs tests
